<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Header puro</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <style>
        :root {
            /* MAIN COLORS — green, white, black */
            --green: #2b7a4b;
            --green-bright: #3e9b62;
            --green-dark: #1f5a38;
            --white: #ffffff;
            --black: #111111;
            --black-soft: #1e1e1e;

            /* MEASURES: spacing scale (rem = relative to root font size) */
            --space-xs: 0.25rem;
            /* 4px  */
            --space-sm: 0.5rem;
            /* 8px  */
            --space-md: 1rem;
            /* 16px */
            --space-lg: 1.5rem;
            /* 24px */
            --space-xl: 2rem;
            /* 32px */
            --space-2xl: 3rem;
            /* 48px */

            /* TYPOGRAPHY MEASURES (font sizes, line heights) */
            --text-xs: 0.75rem;
            /* 12px */
            --text-sm: 0.875rem;
            /* 14px */
            --text-base: 1rem;
            /* 16px */
            --text-md: 1.125rem;
            /* 18px */
            --text-lg: 1.5rem;
            /* 24px */
            --text-xl: 2rem;
            /* 32px */
            --text-2xl: 2.5rem;
            /* 40px */

            --leading-tight: 1.2;
            --leading-normal: 1.5;
            --leading-relaxed: 1.65;

            /* BORDERS & RADIUS MEASURES */
            --radius-sm: 0.25rem;
            --radius-md: 0.5rem;
            --radius-lg: 0.75rem;
            --border-thin: 1px solid;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #fff;
        }

        header{
            background-color: var(--green);
            color: var(--white);
        }

        a, a:hover, a:visited {
            color: var(--white);
            font-style: none;
            text-decoration: none;
        }

        nav{
            display: flex;
            
            background-color: var(--green-dark);
        }


    </style>
</head>

<body>
    <header>
        <div class="return-space">
            <a href=""><span class="material-symbols-outlined">
                    arrow_back
                </span></a>
        </div>
        <div class="title-header">
            <span class="logo"></span>
            <span class="title">B-ONG</span>
        </div>
        <div class="info-header">
            <span class="material-symbols-outlined">
                person
            </span>
        </div>
        <nav>
            <ul class="options-navigator">
                <li class="active"><a href="#">Página Inicial</a></li>
                <li><a href="">Sobre Nós</a></li>
                <div class="section"></div>
            </ul>
        </nav>
    </header>
</body>

</html>
